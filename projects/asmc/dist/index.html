o/favicon-32x32.png"><link rel="icon" type="image/png" sizes="96x96" href="ico/favicon-96x96.png"><link rel="icon" type="image/png" sizes="16x16" href="ico/favicon-16x16.png"><link rel="manifest" href="ico/manifest.json"><meta name="msapplication-TileColor" content="#ffffff"><meta name="msapplication-TileImage" content="ico/ms-icon-144x144.png"><meta name="theme-color" content="#ffffff"><script defer="defer" src="js/app.51bed54c.js"></script><link href="css/app.a0ce7a73.css" rel="stylesheet"></head><body><noscript><h1>ASMC Lab 國立清華大學電子工程研究所葉昭輝實驗室</h1><p>ASMC Lab 國立清華大學電子工程研究所葉昭輝實驗室。 本實驗室由國立清華大學電子工程研究所葉昭輝博士創立，位於國立清華大學工程三館 R209。研究聚焦於二維材料元件、次世代非揮發性記憶體（ReRAM、FeRAM）以及 3DIC 異質整合技術等前瞻半導體領域，致力於突破新世代電子元件與智慧運算技術的發展瓶頸。 實驗室提供完善的研究設備與跨領域研究環境，鼓勵學生從理論分析、元件製程到電性量測與系統整合，培養獨立研究能力與解決問題的思維。期望每位成員在學術研究與實務能力上持續精進，並將研究成果轉化為產業競爭力，迎向半導體科技的未來。 請啟用 JavaScript 以獲得完整體驗。</p></noscript><div id="app"></div></body><script defer="defer" src="https://kit.fontawesome.com/026fbb8b51.js" crossorigin="anonymous"></script></html>
